name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Structural checks
        run: node scripts/ci-check.mjs
      - name: HTML validation
        run: npx html-validate index.html cv.html 404.html
      - name: JS lint
        run: npx eslint main.js assets/hero-mesh.js
