<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06060a">
<title>404 · Christian Dave Sicat</title>
<meta name="description" content="Page not found — Christian Dave Sicat's portfolio.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --bg: #06060a; --surface: #16162a; --border: rgba(255,255,255,0.08);
        --text: #e4e4ed; --text-2: #9494b0; --text-3: #7b7b9e;
        --accent: #7c6aff; --accent-3: #22d3ee;
        --gradient-2: linear-gradient(135deg, #7c6aff 0%, #a78bfa 45%, #22d3ee 100%);
    }
    body {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        padding: 2rem; position: relative; overflow: hidden; text-align: center;
    }
    body::before, body::after {
        content: ""; position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
    }
    body::before { width: 560px; height: 560px; background: rgba(124,106,255,0.18); top: -160px; right: -120px; }
    body::after { width: 420px; height: 420px; background: rgba(34,211,238,0.10); bottom: -140px; left: -100px; }
    .wrap { position: relative; z-index: 1; max-width: 620px; }
    .code {
        font-family: 'Sora', sans-serif; font-weight: 800; line-height: 1;
        font-size: clamp(6rem, 26vw, 13rem); letter-spacing: -0.04em;
        background: var(--gradient-2); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tag {
        font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--accent-3); margin: 0.4rem 0 1.4rem;
    }
    h1 { font-family: 'Sora', sans-serif; font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 700; margin-bottom: 0.9rem; }
    p { color: var(--text-2); line-height: 1.7; margin-bottom: 2.2rem; }
    .actions { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
    a.btn {
        display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
        padding: 0.85rem 1.6rem; border-radius: 12px; font-weight: 600; font-size: 0.92rem;
        transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), box-shadow 0.3s, border-color 0.3s;
    }
    a.primary { background: var(--gradient-2); color: #fff; }
    a.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(124,106,255,0.4); }
    a.ghost { border: 1px solid var(--border); color: var(--text); background: var(--surface); }
    a.ghost:hover { transform: translateY(-2px); border-color: rgba(130,120,255,0.35); }
    .term {
        margin-top: 2.6rem; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--text-3);
        border: 1px solid var(--border); border-radius: 12px; background: rgba(12,12,20,0.6);
        padding: 0.9rem 1.1rem; text-align: left; overflow-x: auto; white-space: nowrap;
    }
    .term .p { color: var(--accent); }
    .term .ok { color: #34d399; }
</style>
</head>
<body>
    <main class="wrap">
        <div class="code">404</div>
        <div class="tag">Page not found</div>
        <h1>This page took an unscheduled outage.</h1>
        <p>Even the best-run systems hit a 404 now and then. The link you followed doesn't exist — but everything else is very much up.</p>
        <div class="actions">
            <a class="btn primary" href="index.html">&#8592; Back to portfolio</a>
            <a class="btn ghost" href="cv.html">View CV</a>
        </div>
        <div class="term">
            <span class="p">$</span> curl -I <span id="path">/</span> &nbsp;&#8594;&nbsp; <span class="ok">404 Not Found</span>
        </div>
    </main>
    <script>
        var p = document.getElementById('path');
        if (p && location.pathname) p.textContent = location.pathname;
    </script>
</body>
</html>
